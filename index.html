<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gear Five Studio</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f4f4; }
        .header { padding: 40px; background: #333; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { max-width: 100%; height: auto; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Gear Five Studio</h1>
        <p>Premium 3D Printed Art</p>
    </div>
    
    <div class="grid">
        <!-- PRODUCT 1 -->
        <div class="card">
            <img src="charizard.jpg" alt="Charizard Wall Art">
            <h3>Charizard Art</h3>
            <p>High-detail 3D print.</p>
        </div>
        
        <!-- Add more cards here following the pattern above -->
    </div>
</body>
</html>
