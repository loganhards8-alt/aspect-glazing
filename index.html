        * {

        }

        body {

        /* Architectural Floating Header */
        header {
            background: rgba(11, 17, 30, 0.85);

            border-bottom: 1px solid rgba(255, 255, 255, 0.05);

            padding: 25px;

            letter-spacing: 2px;

        .logo span {

            font-weight: 300;
        }

        .hero {

            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 25px;

        }

            padding: 6px 16px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: 58px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1.5px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 21px;
            color: #94a3b8;
            margin-bottom: 40px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-elite {
            display: inline-flex;
            align-items: center;
            background: #ffffff;
            color: #0b111e;
            padding: 18px 42px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.05);
        }

            background: #3b82f6;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.35);
        }
